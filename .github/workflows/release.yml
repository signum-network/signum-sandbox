# Every push to develop passes through here. Most of them only get checked; the
# ones that carry a version nobody has released yet get published.
#
# The trigger is the absence of a tag, not a button and not a pull request. That
# makes the whole run idempotent: a re-run, a second push, a double click all
# see the tag and stop. It also means the version in package.json is the switch
# — `bun run new-version` is the intended way to move it, but editing it by hand
# releases just the same.
#
# There is no judgement in this file. Which lines go in a changelog, what the
# release notes say, whether an installation actually works — each of those
# lives in a script that can be run and tested locally. This is the one file in
# the repository that cannot be, so it only puts things in order.
name: release

on:
  push:
    branches: [develop]

permissions:
  contents: write

# Never cancel a release half-way through; queue the next push behind it.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.gate.outputs.version }}
      release: ${{ steps.gate.outputs.release }}
    steps:
      # Full history: the release notes read CHANGELOG.md, and the fast-forward
      # of main needs the commits it is moving over.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version

      # ── what every push gets ──────────────────────────────────
      - run: bun install --frozen-lockfile
      - run: bun run test
      - run: bun run test:launcher
      - run: bun run build

      # ── is this push a release? ───────────────────────────────
      # A fact, looked up, not a decision — hence no script. The remote is
      # asked rather than the local tag list, so a checkout detail cannot turn
      # into a release detail.
      - id: gate
        run: |
          version=$(sed -n 's/.*"version": *"\([^"]*\)".*/\1/p' package.json | head -1)
          [ -n "$version" ] || { echo 'release: package.json has no version' >&2; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [ -n "$(git ls-remote --tags origin "refs/tags/v$version")" ]; then
            echo 'release=false' >> "$GITHUB_OUTPUT"
            echo "checked only: v$version is already released" >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'release=true' >> "$GITHUB_OUTPUT"
            echo "releasing $version" >> "$GITHUB_STEP_SUMMARY"
          fi

      # ── and what only a release gets ──────────────────────────
      - name: Fetch the node artifacts
        if: steps.gate.outputs.release == 'true'
        run: ./scripts/bootstrap.sh

      - name: Assemble the deliverable
        if: steps.gate.outputs.release == 'true'
        run: ./scripts/package.sh

      # The sum is published beside the archive and every download is checked
      # against it, so a release whose sum is missing or wrong must not get out.
      - name: Check the archive against its sum
        if: steps.gate.outputs.release == 'true'
        working-directory: build
        run: sha256sum -c "signum-sandbox-${{ steps.gate.outputs.version }}.zip.sha256"

      # The gate that matters. Nothing is published until a bare Debian
      # container has installed this archive and watched it answer - and,
      # in the windows job below, a Windows machine has too.
      - name: Install it in a container and use it
        if: steps.gate.outputs.release == 'true'
        run: sh scripts/e2e-install.sh "build/signum-sandbox-${{ steps.gate.outputs.version }}.zip"

      # Handed on as it is, not rebuilt: the archive Windows installs and the one
      # that gets published must be the very one whose sum was checked above.
      - uses: actions/upload-artifact@v4
        if: steps.gate.outputs.release == 'true'
        with:
          name: archive
          path: build/signum-sandbox-${{ steps.gate.outputs.version }}.zip*

  # The same gate on Windows, under Windows PowerShell 5.1 - the one every user
  # has. A job of its own only because it needs a machine of its own.
  windows:
    needs: release
    if: needs.release.outputs.release == 'true'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: archive
          path: build
      - name: The launcher's decisions, under Windows PowerShell
        shell: powershell
        run: .\scripts\launcher.test.ps1
      - name: Install it on Windows and use it
        shell: powershell
        run: .\scripts\e2e-install.ps1 "build\signum-sandbox-${{ needs.release.outputs.version }}.zip"

  publish:
    needs: [release, windows]
    if: needs.release.outputs.release == 'true'
    runs-on: ubuntu-latest
    steps:
      # Full history again, for the same two reasons as above.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version

      - uses: actions/download-artifact@v4
        with:
          name: archive
          path: build

      - name: Write the release notes
        run: bun scripts/release-notes.ts > "$RUNNER_TEMP/notes.md"

      # main moves before the release is created, and that order is the point.
      # If this push is rejected, main has diverged, an assumption is broken and
      # nothing gets published. If the release then fails, main points at a
      # commit without one — the tag is still missing, so the next run picks it
      # up and this push becomes a no-op. The other order would leave the one
      # state nothing recovers from: a published release main does not point at.
      - name: Move main to what is being released
        run: git push origin HEAD:main

      # Creates the tag itself, so there is no tag without a release and no
      # release without an installation that worked.
      #
      # An asset is named after the basename of the file, and the one-liner in
      # the README depends on that name: install.sh has to arrive as install.sh
      # for releases/latest/download/install.sh to resolve, and install.ps1 as
      # install.ps1.
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.release.outputs.version }}
        run: |
          gh release create "v$VERSION" \
            --target "$GITHUB_SHA" \
            --title "$VERSION" \
            --notes-file "$RUNNER_TEMP/notes.md" \
            "build/signum-sandbox-$VERSION.zip" \
            "build/signum-sandbox-$VERSION.zip.sha256" \
            scripts/install.sh \
            scripts/install.ps1
